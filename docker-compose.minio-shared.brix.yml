# SkyHub shared MinIO on brix-node (amd64). Counterpart of docker-compose.minio-shared.yml on the Pi.
# Never combine with docker-compose.yml. Start:
#   docker network create skyhub-storage-net   (once)
#   SKYHUB_SHARED_MINIO_CREDENTIALS_FILE=$HOME/.config/skyhub/minio-shared.env \
#     docker compose -f docker-compose.minio-shared.brix.yml up -d
# Data: /srv/appdata/skyhub-next/minio on the internal Samsung 980 (no separate mount, so restart is safe).
name: skyhub-storage
services:
  minio:
    container_name: skyhub-shared-minio
    # Built from source: docker/minio-src (same minio/mc releases as the Pi image).
    image: skyhub/minio:RELEASE.2025-10-15T17-29-55Z-amd64
    pull_policy: never
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    entrypoint: ["/usr/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      # Liveness without credentials (busybox wget from the alpine base image)
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    env_file:
      - path: ${SKYHUB_SHARED_MINIO_CREDENTIALS_FILE:?Set private MinIO env file}
        format: raw
    volumes:
      - type: bind
        source: /srv/appdata/skyhub-next/minio
        target: /data
        bind:
          create_host_path: false
    networks:
      storage:
        aliases: [skyhub-minio]
    # Deliberately no ports: S3 :9000 only on skyhub-storage-net (backend reaches it there).

networks:
  storage:
    external: true
    name: skyhub-storage-net
