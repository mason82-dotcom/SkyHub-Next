name: Cloud API 2 mission planning workspace
on:
  pull_request:
    paths:
      - 'frontend/public/cloud-api2*'
      - 'backend/test/cloud-api2-planning.test.js'
      - 'tests/cloud_api2_planning_browser_smoke.py'
      - 'UX-CONTRACT.md'
      - 'docs/cloud-api2-mission-planning-workspace.md'
      - '.github/workflows/cloud-api2-mission-planning.yml'
  push:
    branches:
      - feature/cloud-api2-mission-planning-workspace-p0-20261107
      - main
    paths:
      - 'frontend/public/cloud-api2*'
      - 'backend/test/cloud-api2-planning.test.js'
      - 'tests/cloud_api2_planning_browser_smoke.py'
      - 'UX-CONTRACT.md'
      - 'docs/cloud-api2-mission-planning-workspace.md'
      - '.github/workflows/cloud-api2-mission-planning.yml'
permissions:
  contents: read
jobs:
  safety-and-existing-wpml:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate syntax of planning and existing portal modules
        run: |
          node --check frontend/public/cloud-api2-planning.mjs
          node --check frontend/public/cloud-api2.js
      - name: Verify navigation contract and canonical WPML tools
        run: |
          node --test \
            backend/test/cloud-api2-planning.test.js \
            backend/test/cloud-api2-module-catalog.test.js \
            backend/test/cloud-api2-p2-ui.test.js \
            backend/test/wpml-editor.test.js \
            backend/test/wpml-survey-preview.test.js \
            backend/test/wpml-route-library-ui.test.js

  chromium-offline-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned offline browser driver
        run: |
          python -m pip install --disable-pip-version-check 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Test real planning editor and route planner at 320/390/834/1440
        run: python tests/cloud_api2_planning_browser_smoke.py
      - name: Attach synthetic-only UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-api2-planning-offline-screenshots
          path: artifacts/cloud-api2-planning-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
