name: WPML offline browser smoke

on:
  pull_request:
    paths:
      - "frontend/public/wpml-*"
      - "frontend/public/vendor/leaflet/**"
      - "backend/test/wpml-*"
      - "tests/wpml_browser_smoke.py"
      - ".github/workflows/wpml-browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wpml-browser-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  offline-editor-chromium:
    # Pin runner because Playwright 1.56.0 browser installer does not support Ubuntu 26.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned browser driver
        run: |
          python -m pip install --disable-pip-version-check "playwright==1.56.0"
          python -m playwright install --with-deps chromium
      - name: Chromium UI test (self-hosted Leaflet, synthetic offline map tiles)
        run: python tests/wpml_browser_smoke.py
      - name: Attach synthetic-only browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wpml-browser-offline-screenshots
          path: artifacts/wpml-browser/*.png
          if-no-files-found: ignore
          retention-days: 7
