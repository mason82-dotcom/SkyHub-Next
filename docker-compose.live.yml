# DJI Pilot 2 livestream relay (MediaMTX). Overlay, opt-in: only used when .env contains
# SKYHUB_LIVE_ENABLED=true (scripts/pi-compose.sh adds it then). Both passwords are mandatory:
# MediaMTX accepts ANY password for a user whose password is empty.
# Only RTMP (from the RC, LAN) is published; HLS and the status API stay on the "live" network.
services:
  mediamtx:
    image: bluenviron/mediamtx:1.21.2
    restart: unless-stopped
    # Same log rotation and Watchtower exclusion as docker-compose.yml (anchors do not cross files).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 64
    environment:
      MTX_AUTHINTERNALUSERS_0_PASS: ${SKYHUB_LIVE_PUBLISH_PASS:?Set SKYHUB_LIVE_PUBLISH_PASS}
      MTX_AUTHINTERNALUSERS_1_PASS: ${SKYHUB_LIVE_READ_PASS:?Set SKYHUB_LIVE_READ_PASS}
    volumes:
      - type: bind
        source: ./docker/mediamtx/mediamtx.yml
        target: /mediamtx.yml
        read_only: true
    ports:
      - "${SKYHUB_LIVE_RTMP_BIND:-0.0.0.0}:${SKYHUB_LIVE_RTMP_PORT:-1935}:1935"
    networks:
      - live
