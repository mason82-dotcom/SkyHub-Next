# Standardbloecke des Images emqx/emqx:5.3.0 (node.data_dir ist Pflicht; Cookie kommt aus EMQX_NODE__COOKIE). node.name hier ist
# wirkungslos: das Image setzt den Namen beim Start, deshalb steht EMQX_NODE__NAME fest in docker-compose.yml.
node {
  name = "emqx@127.0.0.1"
  cookie = "overridden-by-env"
  data_dir = "data"
}
cluster {
  name = emqxcl
  discovery_strategy = manual
}
dashboard {
  listeners.http {
    bind = 18083
  }
}

# Anmeldung ueber die eingebaute Datenbank (Benutzer legt pi-cloud-api-demo.sh per REST-API an; 5.3.0 kennt kein
# bootstrap_file), Berechtigungen ueber eine ACL-Datei, alles Uebrige verweigert.
authentication = [
  {
    mechanism = password_based
    backend = built_in_database
    user_id_type = username
    password_hash_algorithm {
      name = sha256
      salt_position = suffix
    }
  }
]
authorization {
  no_match = deny
  deny_action = disconnect
  sources = [
    {
      type = file
      enable = true
      path = "/opt/emqx/etc/acl.conf"
    }
  ]
}
