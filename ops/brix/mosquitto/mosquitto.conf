# SkyHub Next on brix-node (container eclipse-mosquitto, see docker-compose.brix.yml). Copied from /etc/skyhub-mosquitto on the Pi.
listener 1884 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stderr
log_type error
log_type warning
log_type notice
connection_messages true
max_connections 50
max_packet_size 1048576
